<div class="container py-5">
  <div class="search-header mb-5">
    <h2 class="fw-bold mb-2">Search Results</h2>
    <p class="text-muted" *ngIf="searchQuery">Showing results for: <span
        class="text-dark fw-bold">"{{searchQuery}}"</span></p>
    <div class="search-line"></div>
  </div>

  <div class="row g-4" *ngIf="isLoading">
    <div class="col-md-4" *ngFor="let i of [1,2,3,4,5,6]">
      <div class="card border-0 shadow-sm h-100">
        <div class="skeleton rounded-top" style="height: 200px; width: 100%;"></div>
        <div class="card-body">
          <div class="skeleton skeleton-badge mb-2"></div>
          <div class="skeleton skeleton-title" style="height: 24px;"></div>
          <div class="skeleton skeleton-text"></div>
          <div class="skeleton skeleton-text" style="width: 70%;"></div>
          <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
            <div class="skeleton skeleton-text" style="width: 80px; height: 12px; margin-bottom: 0;"></div>
            <div class="skeleton rounded-circle" style="width: 16px; height: 16px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4" *ngIf="!isLoading && articles.length > 0">
    <div class="col-md-4" *ngFor="let article of articles">
      <div class="card border-0 shadow-sm h-100 search-result-card"
        [routerLink]="['/article', article.slug || article.id]">
        <div class="overflow-hidden rounded-top">
          <img [src]="getImageUrl(article.imageUrl)" class="card-img-top"
            style="height: 200px; object-fit: cover; transition: transform 0.5s ease;" [alt]="article.title">
        </div>
        <div class="card-body">
          <span class="badge bg-light text-muted mb-2 text-uppercase">{{article.category}}</span>
          <h5 class="fw-bold mb-2 line-clamp-2">{{article.title}}</h5>
          <p class="text-secondary small mb-3 line-clamp-3">{{article.content}}</p>
          <div class="d-flex justify-content-between align-items-center mt-auto pt-2 border-top">
            <span class="small text-muted">By {{article.author}}</span>
            <i class="fa-solid fa-arrow-right theme-text small"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!isLoading && articles.length === 0" class="text-center py-5">
    <div class="empty-state p-5">
      <div class="empty-state-icon">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
      <h3 class="empty-state-title">No Stories Found</h3>
      <p class="empty-state-text mb-4">We couldn't find any stories matching your search. Try different keywords or browse our categories.</p>
      <button routerLink="/" class="btn btn-dark rounded-pill px-4">Back to Home</button>
    </div>
  </div>
</div>
