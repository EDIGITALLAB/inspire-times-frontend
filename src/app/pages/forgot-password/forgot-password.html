<div class="forgot-page min-vh-100 d-flex align-items-center justify-content-center py-5 px-3">
  <div class="card forgot-card shadow-lg rounded-4 p-4 position-relative overflow-hidden hover-up">
    <!-- Background Blobs -->
    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <div class="card-body position-relative z-1">
      <!-- Title -->
      <div class="text-center mb-4">
        <i class="fa-solid fa-key theme-text fs-1 mb-3"></i>
        <h3 class="fw-bold mb-1">Forgot Password</h3>
        <p class="text-muted small">Enter your email address to recover your account</p>
      </div>

      <!-- Messages -->
      <div *ngIf="message" class="alert alert-success border-0 rounded-3 small mb-3">
        <i class="fa-solid fa-circle-check me-2"></i>{{ message }}
      </div>
      <div *ngIf="error" class="alert alert-danger border-0 rounded-3 small mb-3">
        <i class="fa-solid fa-circle-exclamation me-2"></i>{{ error }}
      </div>

      <!-- Form -->
      <form (submit)="onSubmit()" *ngIf="!message">
        <div class="mb-4">
          <label class="form-label fw-bold small text-uppercase" style="color: #666;">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0"><i class="fa-solid fa-envelope text-muted"></i></span>
            <input type="email" class="form-control bg-light border-0 py-2" name="email" [(ngModel)]="email" 
                   required placeholder="Enter your registered email..." [disabled]="isLoading">
          </div>
        </div>

        <button type="submit" class="btn btn-dark w-100 py-2.5 fw-bold rounded-3 mb-3 d-flex align-items-center justify-content-center"
                [disabled]="isLoading || !email">
          <i class="fa-solid fa-spinner fa-spin me-2" *ngIf="isLoading"></i>
          SEND RESET INSTRUCTIONS
        </button>
      </form>

      <!-- Back to Login -->
      <div class="text-center mt-3">
        <a routerLink="/login" class="text-decoration-none text-dark small fw-bold">
          <i class="fa-solid fa-arrow-left me-2"></i>Back to Login
        </a>
      </div>
    </div>
  </div>
</div>
